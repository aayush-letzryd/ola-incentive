name: Scheduled Ola Incentive ETL

on:
  schedule:
    # Runs 3 times a day: 04:00, 10:00, 16:00 UTC (09:30, 15:30, 21:30 IST)
    - cron: '0 4,10,16 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Force re-ingestion of already processed files'
        required: false
        type: boolean
        default: false

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Ola Incentive Pipeline
        env:
          DB_HOST: ${{ secrets.DB_HOST || '35.200.196.113' }}
          DB_PORT: ${{ secrets.DB_PORT || '5432' }}
          DB_NAME: ${{ secrets.DB_NAME || 'postgres' }}
          DB_USER: ${{ secrets.DB_USER || 'postgres' }}
          DB_PASS: ${{ secrets.DB_PASS }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID || '1BXtva5QfEOGvVmCKBxJxgpJnDDLpSBbC' }}
          LOG_LEVEL: INFO
        run: |
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            python main.py --run-once --force
          else
            python main.py --run-once
          fi
